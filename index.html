<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NoesisMath Akademi · tasarım önizlemeleri</title>
<style>
  :root { --ink: #0e1c26; --red: #de0202; --paper: #fafaf7; --soft: #555f65; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--paper); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { width: min(100%, 34rem); }
  h1 { font-size: 1.75rem; line-height: 1.2; margin: 0 0 .5rem; }
  p { color: var(--soft); margin: 0 0 1.5rem; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
  a { display: flex; justify-content: space-between; align-items: center; gap: 1rem; min-height: 56px; padding: .75rem 1.1rem;
      border: 1.5px solid var(--ink); border-radius: 6px; color: var(--ink); text-decoration: none; font-weight: 700; }
  a span { color: var(--soft); font-weight: 400; font-size: .9rem; }
  a:hover { background: var(--ink); color: var(--paper); }
  a:hover span { color: var(--paper); }
  a:focus-visible { outline: 3px solid var(--red); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>NoesisMath Akademi</h1>
  <p>Tanıtım sitesi için dört tasarım önerisi. İçerik hepsinde aynı; değişen yalnızca görünüş.</p>
  <ul>
    <li><a href="safak/">Şafak <span>yeni öneri</span></a></li>
    <li><a href="domino/">Domino tahtası <span>1. öneri</span></a></li>
    <li><a href="poster/">Geometri posteri <span>2. öneri</span></a></li>
    <li><a href="mevcut/">Lacivert <span>3. öneri</span></a></li>
  </ul>
</main>
</body>
</html>
